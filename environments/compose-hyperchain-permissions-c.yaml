groups:
  - name: admins
    members:
      - "0x36615Cf349d7F6344891B1e7CA7C72883F5dc049" # Default Rich account
contracts:
  # InvoicePayment
  - address: "0x8B4746a24f4F8eD5Dbfe7597902806f7Cd6790fe"
    methods:
      - signature: function cancelInvoice(uint256)
        read:
          type: public
        write:
          type: public
      - signature: function createInvoice(address,uint256,address,uint256,uint256,address,address,string)
        read:
          type: public
        write:
          type: public
      - signature: function exchangeRates(address,address)
        read:
          type: public
        write:
          type: public
      - signature: function getInvoiceDetails(uint256)
        read:
          type: public
        write:
          type: public
      - signature: function getMultipleInvoiceDetails(uint256[])
        read:
          type: public
        write:
          type: public
      - signature: function getUserAllInvoices(address,uint256,uint256,uint256,uint256)
        read:
          type: checkArgument
          argIndex: 0
        write:
          type: public
      - signature: function getConversionAmount(address,address,uint256)
        read:
          type: public
        write:
          type: public
      - signature: function getWhitelistedTokens()
        read:
          type: public
        write:
          type: public
      - signature: function whitelistedTokens(address)
        read:
          type: public
        write:
          type: public
      - signature: function getUserCreatedInvoices(address,uint256,uint256)
        read:
          type: checkArgument
          argIndex: 0
        write:
          type: public
      - signature: function getUserCreatedInvoiceCount(address)
        read:
          type: checkArgument
          argIndex: 0
        write:
          type: public
      - signature: function getUserPendingInvoices(address,uint256,uint256)
        read:
          type: checkArgument
          argIndex: 0
        write:
          type: public
      - signature: function getUserPendingInvoiceCount(address)
        read:
          type: checkArgument
          argIndex: 0
        write:
          type: public
      - signature: function payInvoice(uint256,address)
        read:
          type: public
        write:
          type: public
  # USDC
  - address: "0xfF74b0Dd491269F4bdabC267f7f812977e3F22A2"
    methods:
      - signature: function decimals() public view virtual returns (uint8)
        read:
          type: public
        write:
          type: public
      - signature: function mint(address _to, uint256 _amount) public returns (bool)
        read:
          type: public
        write:
          type: public
      - signature: function name() public view virtual returns (string memory)
        read:
          type: public
        write:
          type: public
      - signature: function symbol() public view virtual returns (string memory)
        read:
          type: public
        write:
          type: public
      - signature: totalSupply()
        read:
          type: public
        write:
          type: public
      - signature: "function balanceOf(address) view returns (uint256)"
        read:
          type: checkArgument
          argIndex: 0
        write:
          type: closed
      - signature: "function allowance(address, address) view returns (uint256)"
        read:
          type: oneOf
          rules:
            - type: checkArgument
              argIndex: 0
            - type: checkArgument
              argIndex: 1
        write:
          type: closed
      - signature: function approve(address spender, uint256 value) public returns (bool)
        # This doesn't leek information because we validate that current user
        # is msg.sender.
        read:
          type: public
        write:
          type: public
      - signature: function transferFrom(address from, address to, uint256 value) public virtual returns (bool)
        # This doesn't leek information because we validate that current user
        # is msg.sender.
        read:
          type: public
        write:
          type: public
      - signature: function increaseAllowance(address spender, uint256 addedValue) returns bool
        # This doesn't leek information because we validate that current user
        # is msg.sender.
        read:
          type: public
        write:
          type: public
      - signature: function decreaseAllowance(address spender, uint256 addedValue) returns bool
        # This doesn't leek information because we validate that current user
        # is msg.sender.
        read:
          type: public
        write:
          type: public
      - signature: authorizedBalanceOf(address)(uint256)
        read:
          type: public
        write:
          type: public
      - signature: function publicThreshold(address target) public view returns (uint256, bool)
        read:
          type: public
        write:
          type: closed
      - signature: function changePublicThreshold(uint256 publicThreshold) external
        read:
          type: public
        write:
          type: public
      - signature: function supportsInterface(bytes4) view
        read:
          type: public
        write:
          type: public
